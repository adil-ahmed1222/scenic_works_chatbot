name: Daily knowledge-base update

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install crawler + pipeline
        run: |
          pip install -r scraper/requirements.txt
          pip install -r knowledge-base/requirements.txt
      - name: Install Playwright (Crawl4AI)
        run: python -m playwright install --with-deps chromium
      - name: Run incremental update
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          CRAWL_BASE_URL: https://adroitiame.com
        run: python scheduler/daily_update.py
      - name: Upload crawl status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-status
          path: scraper/data/crawl_status.json
